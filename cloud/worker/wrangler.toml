name = "openmessage-connector"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# Needed by the OAuth provider for Client ID Metadata Document (CIMD) clients,
# and it makes fetch() to a hostname on our own zone go out through the public
# edge (where Cloudflare Access sits) instead of straight to the origin.
compatibility_flags = ["global_fetch_strictly_public"]

# Not created yet. Run `wrangler kv namespace create OAUTH_KV` and paste the id.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "REPLACE-WITH-KV-NAMESPACE-ID"

[vars]
# Public https origin of this Worker, no trailing slash. Must match the
# redirect URI registered with Google (<PUBLIC_URL>/callback).
PUBLIC_URL = "https://REPLACE-worker-hostname"
# Tunnel hostname that Cloudflare Access protects, no trailing slash.
ORIGIN_URL = "https://REPLACE-tunnel-hostname"
# The one Google account allowed to sign in.
ALLOWED_EMAIL = "REPLACE@example.com"

# Secrets (set with `wrangler secret put`, never in this file):
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
#   CF_ACCESS_CLIENT_ID, CF_ACCESS_CLIENT_SECRET
