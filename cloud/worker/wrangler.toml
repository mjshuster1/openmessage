name = "openmessage-connector"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# Needed by the OAuth provider for Client ID Metadata Document (CIMD) clients.
compatibility_flags = ["global_fetch_strictly_public"]

# KV namespace OAUTH_KV.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "0d26552528104d9f82e683197fc48c47"

# Workers VPC Service: host 127.0.0.1, HTTP port 7007, through tunnel om-vm
# (bcb82990-...) on the GCE VM since 2026-11-03. Back to the Mac: run
# `wrangler vpc service update` with --tunnel-id ffa24fcf-f72b-49ab-8844-78c85a4f2460
# (openmessage-mac). The dashboard can't change a service's tunnel.
[[vpc_services]]
binding = "ORIGIN"
service_id = "01a198d3-3711-7ab0-9961-1fafca289cac"

[vars]
# Public https origin of this Worker, no trailing slash. Must match the
# redirect URI registered with Google (<PUBLIC_URL>/callback).
PUBLIC_URL = "https://openmessage-connector.mjshuster1.workers.dev"

# Secrets (set in the dashboard or with `wrangler secret put`, never in this file):
#   ALLOWED_EMAIL (the one Google account allowed to sign in; a secret so it
#   stays out of this public repo), GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
